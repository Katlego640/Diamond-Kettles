<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamond Kettles - Product Enquiry</title>
</head>
<body>

    
    <header>
        <img src="images/diamond_kettles_logo.jpg" alt="Diamond Kettles Logo" width="150">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

   
    <main>
        <section>
            <h1>Make an Enquiry here!</h1>
            <p>Interested in ordering a specific product from us? Send us a request below and we will get back to you.</p>

            <form>
                <label for="fullname">Full Name:</label><br>
                <input type="text" id="fullname" name="fullname"><br><br>

                <label for="email">Email Address:</label><br>
                <input type="email" id="email" name="email"><br><br>

                <label for="product">Select Product:</label><br>
                <select id="product" name="product">
                    <option value="obsidian">Obsidian Diamond Edition</option>
                    <option value="copper">Copper Elegance Kettle</option>
                </select><br><br>

                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="4"></textarea><br><br>

                <button type="submit">Submit Enquiry</button>
            </form>
        </section>
    </main>

   
    <footer>
        <p>&copy; 2026 Diamond Kettles. All Rights Reserved.</p>
    </footer>

</body>
</html>
